name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    needs: [node-monitor]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download node-monitor binaries
        uses: actions/download-artifact@v4
        with:
          name: node-monitor-binaries
          path: apps/web/static/node-monitor/

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (svelte-check + tsc)
        run: bun run check

      - name: Lint (eslint + prettier)
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  node-monitor:
    name: node-monitor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/node-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/node-monitor/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: apps/node-monitor

      - name: Cross-compile node-monitor for release
        run: |
          mkdir -p ../web/static/node-monitor
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../web/static/node-monitor/node-monitor-amd64 ./cmd/monitor/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../web/static/node-monitor/node-monitor-arm64 ./cmd/monitor/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o ../web/static/node-monitor/node-monitor-armv7 ./cmd/monitor/

      - name: Upload node-monitor binaries
        uses: actions/upload-artifact@v4
        with:
          name: node-monitor-binaries
          path: apps/web/static/node-monitor/
          if-no-files-found: error
