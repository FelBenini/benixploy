#
# benisploy — sshd SFTP restrictions for the benisploy user.
#
# Append this to /etc/ssh/sshd_config (or drop it into /etc/ssh/sshd_config.d/
# on systems that support Include directives), then reload sshd:
#
#     cat deploy/node-setup/sshd-restrictions.conf >> /etc/ssh/sshd_config
#     systemctl reload sshd    # or  service sshd reload
#
# ---------------------------------------------------------------------------
# Match block for the dedicated benisploy user
# ---------------------------------------------------------------------------
Match User benisploy
    #
    # SFTP-only subsystem, not a full shell.  All file-system operations are
    # jailed to /opt/benisploy/apps/ so a compromised control-plane credential
    # cannot overwrite files outside the app directory tree.
    #
    ForceCommand internal-sftp
    ChrootDirectory /opt/benisploy/apps

    #
    # Hardened defaults — disable everything except the SFTP channel.
    #
    X11Forwarding no
    AllowTcpForwarding no
    PermitTTY no
    PermitTunnel no
    GatewayPorts no
    AllowAgentForwarding no
    PermitOpen none
    MaxSessions 1
